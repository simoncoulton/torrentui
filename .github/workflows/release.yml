name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build binaries
# for each platform, attach them to a GitHub release, and (once set up, see
# packaging/README.md) update the Homebrew tap and the AUR package.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the crate version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="torrentui-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/torrentui" LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            torrentui-*.tar.gz
            torrentui-*.tar.gz.sha256

  # Both publish jobs are off until the repository variable is set to "true"
  # (Settings > Secrets and variables > Actions > Variables), and skip
  # pre-release tags such as v0.2.0-rc1.
  homebrew:
    name: update Homebrew tap
    needs: build
    if: ${{ vars.PUBLISH_HOMEBREW == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-torrentui
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Point the formula at this release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          [ -n "$sha" ] || { echo "could not fetch $url" >&2; exit 1; }
          sed -i -E "s|^  url \".*\"|  url \"${url}\"|; s|^  sha256 \".*\"|  sha256 \"${sha}\"|" Formula/torrentui.rb
          git diff --exit-code Formula/torrentui.rb && { echo "formula already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "torrentui ${TAG}"
          git push

  aur:
    name: update AUR package
    needs: build
    if: ${{ vars.PUBLISH_AUR == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      # Fills in the checksums, builds and tests the package in an Arch
      # container, regenerates .SRCINFO and pushes to aur.archlinux.org.
      - uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: torrentui
          pkgbuild: ./packaging/aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: ${{ github.repository_owner }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
